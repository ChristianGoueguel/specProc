url: https://christiangoueguel.com/specProc/
template:
  bootstrap: 5
  math-rendering: katex
reference:
- title: Univariate filtering
  desc: >
    Functions used to assess individual variables
    or features independently.
  contents:
  - zscore
  - iqr_outliers
  - directional_outlyingness

- title: Multivariate filtering

- subtitle: robust PCA
  desc: >
    Principal component analysis that resists outlying observations
    (and, for MacroPCA and cellPCA, outlying cells and missing values).
  contents:
  - robpca
  - rospca
  - macropca
  - cellpca
  - predict.specproc_robpca
  - plot_outlier_map
  - plot_cell_map
  - flagged_regions

- subtitle: self-organizing maps
  desc: >
    Nonlinear maps of the spectra onto a grid of prototype spectra, for
    sorting samples and flagging novel ones.
  contents:
  - som
  - predict.specproc_som
  - plot_som
  - som_stability

- subtitle: orthogonalization methods
  desc: >
    Functions used to identify and remove unwanted covariance
    structures and sources of variance from the multivariate data.
  contents:
  - epo
  - osc
  - opls
  - predict.specproc_opls
  - o2pls
  - direct_osc
  - projected_osc
  - y_gradient_glsw
  - direct_orthogonal
  - predict.specproc_filter

- subtitle: robust PLS and PCR regression, wavelength selection
  desc: >
    Robust PLS and principal component regression that resist outlying
    spectra and wrong reference values, their robust cross-validation, and
    the selection of the informative wavelengths (VIP, selectivity ratio,
    interval PLS).
  contents:
  - rsimpls
  - predict.specproc_rsimpls
  - pls_rsimpls
  - rpcr
  - predict.specproc_rpcr
  - robust_rmsecv
  - linear_reg_lts
  - select_wavelengths
  - plot_wavelength_selection

- subtitle: robust classification
  desc: >
    Classification that resists outlying observations of the training data:
    robust SIMCA for whole spectra, and robust linear and quadratic
    discriminant analysis for a few variables (line intensities, robust
    principal component scores).
  contents:
  - rsimca
  - predict.specproc_rsimca
  - plot_coomans
  - simca
  - simca_gamma
  - robust_da
  - predict.specproc_robust_da

- subtitle: figures of merit
  desc: >
    Net analyte signal of a multivariate calibration model, with its
    sensitivity, selectivity and limits of detection and quantification.
  contents:
  - nas
  - predict.specproc_nas

- subtitle: calibration transfer
  desc: >
    Functions used to to transfer a calibration model developed on one
    instrument to another instrument.
  contents:
  - pds
  - glsw

- title: Recipe steps (tidymodels)
  desc: >
    Steps for the recipes package, so that preprocessing and orthogonalization
    are estimated on the training data of each resample and can be tuned
    within a tidymodels workflow.

- subtitle: preprocessing
  contents:
  - step_baseline
  - step_savgol
  - step_gap_derivative
  - step_bin_spectra
  - step_wavelet
  - step_snv
  - step_spectral_norm
  - step_msc
  - step_emsc
  - step_pareto_scale
  - step_poisson_scale

- subtitle: LIBS lines and shots
  contents:
  - step_line_intensities
  - step_line_ratio
  - step_reject_shots

- subtitle: robust transformation, PCA and PLS
  contents:
  - step_robust_bcyj
  - step_robpca
  - step_rospca
  - step_macropca
  - step_cellpca
  - step_rsimpls

- subtitle: orthogonalization
  contents:
  - step_epo
  - step_glsw
  - step_osc
  - step_direct_orthogonal
  - step_direct_osc
  - step_projected_osc
  - step_opls
  - step_o2pls
  - step_y_gradient_glsw

- subtitle: wavelength selection
  contents:
  - step_select_wavelengths

- subtitle: tuning parameters
  contents:
  - baseline_lambda
  - glsw_alpha
  - savgol_derivative
  - wavelet_level
  - spectral_norm_method
  - num_intervals

- title: Line identification
  desc: >
    Candidate emission lines from the NIST Atomic Spectra Database, overlaid
    on spectra, an interactive app to identify lines, and the calibration of
    the wavelength axis on reference lines.
  contents:
  - line_finder
  - libs_lines
  - plot_lines
  - wavelength_calibration
  - apply_calibration
  - predict.specproc_wavelength_calibration
  - plot_wavelength_calibration

- title: Plasma diagnostics
  desc: >
    Electron density from Stark broadening (with the STARK-B database),
    excitation temperature from Boltzmann and Saha-Boltzmann plots, and
    checks of LTE, self-absorption and detector saturation.
  contents:
  - nist_lines
  - nist_ionization_energy
  - nist_levels
  - starkb_lines
  - read_starkb
  - stark_table
  - stark_width
  - electron_density
  - boltzmann
  - saha_boltzmann
  - plot_boltzmann
  - mcwhirter_criterion
  - self_absorption
  - correct_self_absorption
  - saturation_summary

- title: Line intensities and quantification
  desc: >
    Intensities of emission lines, univariate calibration curves with
    limits of detection, and calibration-free composition (CF-LIBS).
  contents:
  - line_intensities
  - calibration_curve
  - predict.specproc_calibration
  - plot_calibration
  - cf_libs

- title: Peak fitting
  desc: >
    Functions used to characterize spectral lines.
    The choice of the fitting function depends on the specific broadening
    mechanisms and physical conditions of the emitting environment.
  contents:
  - peak_fit
  - multipeak_fit
  - voigt_fwhm

- title: Data visualization
  desc: >
    Functions that help assess data visually.
  contents:
  - plot_fit
  - plot_spectra
  - plot_embedding
  - plot_loadings
  - loading_peaks
  - hotelling_t2
  - q_residuals
  - dmodx
  - plot_influence
  - contributions
  - plot_contributions
  - plot_outliers
  - adjusted_boxplot
  - generalized_boxplot

- title: Smoothing and derivatives
  desc: >
    Functions used to increase the signal-to-noise ratio, or to compute
    derivatives of the spectra.
  contents:
  - savitzky_golay
  - gap_derivative
  - bin_spectra
  - wavelet_features
  - average
  - reject_shots
  - plot_shots

- title: Baseline correction
  desc: >
    Functions used to fit and remove the background emission.
  contents:
  - baseline_als
  - baseline_lsp
  - baseline_arpls

- title: Normalization

- subtitle: samples normalization
  desc: >
    Functions used to adjust the systematic differences among samples.
  contents:
  - msc
  - emsc
  - predict.specproc_emsc
  - normalize

- subtitle: data scaling
  desc: >
    Functions used to adjust each variable/feature by a scaling factor computed
    based on the dispersion of the variable.
  contents:
  - snv
  - pareto_scale
  - minmax
  - center
  - poisson_scale

- subtitle: data transformation
  desc: >
    Function used to transform variable(s) toward central normality.
  contents:
  - robust_bcyj

- title: Robust statistical estimators

- subtitle: biweight
  desc: >
    Functions that use Tukey’s biweight formalism.
  contents:
  - biweight_scale
  - biweight_location
  - biweight_midvariance
  - biweight_midcovariance
  - biweight_midcorrelation

- subtitle: tail weight
  desc: >
    Functions used to measure the tail weight of a distribution.
  contents:
  - quantile_weight
  - medcouple_weight

- subtitle: scale
  desc: >
    Function used to compute highly robust estimators for scale (or dispersion).
  contents:
  - umad
  - rousseeuw_croux

- title: Special functions
  desc: >
    Functions used for charcaterizing plasma emission in laser spectroscopy.
  contents:
  - tukey_gh
  - voigt_profile
  - gaussian_profile
  - lorentzian_profile
  - pseudo_voigt_profile

- title: Miscellaneous
  contents:
  - correlation
  - summary_stats

- title: Data
  contents:
  - forageLIBS
  - forageShots

articles:
- title: A LIBS workflow
  navbar: ~
  contents:
  - peak-fitting
  - preprocessing
  - calibration
  - plasma-diagnostics
